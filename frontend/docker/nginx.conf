# XGuide 统一入口：前端静态页 + /api 反代后端（实际生效的 nginx 配置）。
# 安全基线：安全响应头、API 限流、SSE 流式透传、管理面端点对外屏蔽。
# 注意：仓库里旧的 config/nginx/nginx.conf 是从未被任何构建引用的死配置，已删除；
# 修改安全配置请只改本文件。

# 限流 zone（本文件被 include 进 http 上下文，可在此定义）：按客户端 IP 10 r/s
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # 安全响应头（X-XSS-Protection 已被现代浏览器废弃，不再发送）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 后端管理面端点不对外暴露。
    # Prometheus 抓取走内部网络直连 echoguide:8000，不经 nginx；
    # /api/docs 等 Swagger 路径只应通过直连 8100 端口的开发链路访问。
    location ~ ^/api/(docs|redoc|openapi\.json|metrics)$ {
        return 404;
    }

    # EchoGuide Python 后端（统一 /api 前缀；去除前缀后转发原路由）
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://echoguide:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # SSE 流式透传：/chat/stream 逐 token 到达前端需要关闭缓冲；
        # 读超时放宽到 300s，避免长生成在 token 间隔处被掐断
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
