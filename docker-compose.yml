# XGuide 校园个人 Agent — Docker Compose 服务编排
# 四层记忆（L0-L3 金字塔）：SQLite 原文/事实 + ChromaDB 场景/画像 + Redis 工作记忆
#
# 网络分层：
#   edge     —— 对外入口（nginx、直连 API 的 echoguide）
#   internal —— 纯内部服务（redis/chromadb/prometheus），不发布宿主机端口、
#               不路由外网。需要本机调试内部服务时用
#               `docker compose exec redis redis-cli -a "$REDIS_PASSWORD"` 等命令。
#
# REDIS_PASSWORD 为必填项（:? 语法），缺失时 compose 直接报错而不是静默回落弱密码。

# 镜像 tag 按 digest 钉死（digest 取自 docker image inspect 的 RepoDigests）。
# 升级：docker pull <image>:<new-tag> 后更新 tag 与 digest。

services:

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: echoguide-redis
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置（参考 .env.example）}"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      # ${REDIS_PASSWORD} 由 compose 在宿主侧插值后进入容器 shell
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库（情景记忆 + 用户画像）────────────────────────────────
  chromadb:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: echoguide-chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v2/heartbeat || exit 1"]  # chroma 1.x REST API 为 v2（v1 已 410）
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus 监控（内网抓取 echoguide:8000/metrics，不经 nginx）─────────────
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: echoguide-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      # 不开 --web.enable-lifecycle：该 API 无鉴权，开了等于把重启/关闭
      # Prometheus 的能力暴露给任何能访问该端口的人
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则目录（prometheus.yml 的 rule_files 指向 alerts/*.yml）
      - ./config/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── XGuide 主应用 ───────────────────────────────────────────────────────────
  echoguide:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: echoguide-app
    ports:
      # 外部端口 8100（避免与宿主机其他项目占用 8000 冲突），容器内部仍为 8000
      - "8100:8000"
    env_file:
      - .env
    environment:
      # 容器内固定值，覆盖 .env 中的本地值（本地模式用 8100/localhost，
      # 容器内必须用 8000/内部服务名，见 .env 头部说明）
      - TZ=Asia/Shanghai
      - API_PORT=8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}@redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - ECHOGUIDE_SKILLS_DIR=/app/skills
      - ECHOGUIDE_DB_PATH=/app/data/echoguide.db
      - ECHOGUIDE_PUBLIC_DATA_DIR=/app/data/public
    volumes:
      # 挂载整个 data 目录：SQLite 个人数据（echoguide.db）与公开信息
      # 在容器内自动创建，避免 bind mount 不存在的文件被 Docker 建为目录
      - ./data:/app/data
      - ./skills:/app/skills
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx 统一入口（前端页面 + API 转发）────────────────────────────────────
  # 80 端口可能被其他软件占用，因此外部使用 8088；容器内部仍为 80
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echoguide-nginx
    ports:
      - "8088:80"
    volumes:
      - nginx-logs:/var/log/nginx
    depends_on:
      echoguide:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      # 用 127.0.0.1 而非 localhost：alpine 中 localhost 解析为 ::1（IPv6），
      # 而 nginx 只监听 IPv4，会导致健康检查误判失败
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true  # 不提供外网路由：纯内部服务即使被攻破也无法主动外连

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
